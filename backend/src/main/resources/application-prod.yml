spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 120 # 2 hours

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Notes:
# - Replace <PROD_DB_HOST>, <PROD_DB_USER>, and <PROD_DB_PASSWORD> with actual production values.
# - Ensure the JWT secret is securely managed in production environments.
# - CORS_ALLOWED_ORIGINS can be set via environment variable with multiple URLs separated by commas
server:
  port: 8080
