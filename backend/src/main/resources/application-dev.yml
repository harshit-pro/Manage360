spring:
  datasource:
   url: jdbc:postgresql://localhost:5433/manage360db
   username: postgres
   password: 12345

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-please-change}
    expiration-minutes: 60 # 1 hour

app:
  cors:
    allowed-origins: http://localhost:5174,http://localhost:5173,http://localhost:3000

#  •	ddl-auto: validate → Flyway owns schema
#  •	Never update or create in production systems